name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Fetch the BASS audio libraries
        shell: pwsh
        run: tools\get-bass.ps1
      - name: Build
        run: dotnet build -c Release
      - name: Unit tests
        run: dotnet test -c Release --no-build --filter "Category!=E2E"
      - name: Check packages for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list Audlet/Audlet.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }
